<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente Voz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div>
    <h1>Assistente Voz</h1>
    <p>Você fala. A IA organiza.</p>
  </div>
  <span id="status">online</span>
</header>

<main>
  <section class="hero">
    <button id="mic" class="mic">🎙️</button>
    <textarea id="input" placeholder="Fale ou digite: “Amanhã às 9h estudar Python por 1 hora.”"></textarea>
    <button id="process">Organizar</button>
    <div id="interpretation"></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>Hoje</h2>
      <div id="events"></div>
    </div>
    <div class="card">
      <h2>Tarefas</h2>
      <div id="tasks"></div>
    </div>
  </section>

  <section class="card">
    <h2>Reunião → briefing</h2>
    <textarea id="transcript" placeholder="Cole aqui uma transcrição de reunião para testar o resumo automático."></textarea>
    <button id="brief">Gerar briefing</button>
    <pre id="briefing"></pre>
  </section>

  <section class="card">
    <h2>Plano de estudos</h2>
    <div class="formgrid">
      <input id="subject" placeholder="Matéria (ex.: Python)">
      <input id="goal" placeholder="Objetivo">
      <input id="minutes" type="number" value="60" min="10">
      <input id="days" type="number" value="5" min="1" max="7">
    </div>
    <button id="study">Montar plano</button>
    <pre id="studyout"></pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
